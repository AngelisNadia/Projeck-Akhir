<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantu Nyata - Lupa Kata Sandi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background: #f8f6f4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BAGIAN INPUT EMAIL */
        .input-box {
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 10px;
            border: none;
            border-bottom: 2px solid rgba(14, 50, 97, 0.2);
            outline: none;
            font-size: 14px;
            background: transparent;
        }

        .input-box input:focus {
            border-bottom: 2px solid #0e3261;
        }

        /* BAGIAN BUTTON KIRIM EMAIL */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            background-color: #0e3261;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

    </style>
</head>
<body>
    <div class="card text-center" style="max-width: 500px; background-color: white; padding: 60px; border:none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        <h1 style="font-size: 28px; font-weight: 600; color: #0e3261; margin-bottom: 10px;">Lupa Kata Sandi?</h1>
        <p style="font-size: 14px; color: #666; margin-bottom: 30px; margin-top: 15px;">Masukkan email kamu untuk menerima link reset password</p>
        <div class="input-box">
            <input type="email" name="email" placeholder="Email kamu">
        </div>
        <a href="verif-reset-tunggu.html" class="btn">
            Kirim
        </a>
        <div class="kembali" style="margin-top: 15px; font-size: 14px;">
            <a href="index.html" style="text-decoration: none; color: #0e3261;">Kembali ke Login</a>
        </div>
    </div>
</body>
</html>
