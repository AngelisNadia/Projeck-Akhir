<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Akun</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            font-size: 14px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f6f4;
            transition: 0.5s;
        }

        /* BAGIAN BUTTON KEMBALI KE LOGIN */
        .custom-btn {
            margin-top: 25px;
            padding: 12px 25px;
            border-radius: 50px;
            background: #0e3261;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
        }

            .custom-btn:hover {
                transform: translateY(-4px);
                color: white;
            }

    </style>
</head>
<body>
    <div class="card text-center" style="padding: 60px; max-width: 500px; border: none; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        <div class="icon" style="font-size: 48px; margin-bottom: 20px;">📩</div>
        <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 10px; color: #0e3261;">Menunggu Verifikasi</h1>
        <p style="font-size: 14px; font-weight: 600; color: #666; line-height: 1.6;">
            Akun kamu berhasil didaftarkan.<br>
            Tunggu verifikasi melalui email.
        </p>
        <a href="loginreg.html" class="custom-btn">Kembali ke Login</a>
    </div>
</body>
</html>
