<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantu Nyata — Masuk & Daftar</title>

    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans',sans-serif;
        }

        body{
            background-color: #f7f4ef;
            min-height: 100vh;
            overflow-x: hidden;
            transition: 0.5s;
            padding: 20px;
        }

            /* BAGIAN KETIKA DIKLIK DAFTAR MAKA AKAN BERUBAH GELAP */
            body.dark{
                background-color: #0e3261;
            }

        /* MEMBUNGKUS KOTAK FORM LOGIN DAN REGISTER */
        .wrap{
            width: 430px;
            margin-top: 50px;
            margin-bottom: 50px;
            background-color: white;
            border-radius: 35px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            transition: 0.5s ease;
        }

            /* PEMBUNGKUS - KETIKA GELAP */
            body.dark .wrap{
                background-color: #102f5b;
                box-shadow: none;
            }

        .logo{
            font-size: 38px;
            font-weight: 800;
            color: #1b2559;
            text-align: center;
            margin-bottom: 45px;
            transition: 0.4s;
            letter-spacing: -1px;
        }

            body.dark .logo{
                color: white;
            }

        /* TOMBOL LOGIN & REGISTER */
        .tombol-dua{
            width: 250px;
            height: 58px;
            background-color: #f2f2f2;
            border-radius: 50px;
            position: relative;
            margin: auto;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: 0.4s;
        }

            /* TOMBOL LOGIN & REGISTER KETIKA GELAP */
            body.dark .tombol-dua{
                background-color: rgba(255,255,255,0.12);
            }

        /* BACKGROUN TOMBOL LOGIN KE REGIS */
        .slide-btn{
            width: 125px;
            height: 58px;
            border-radius: 50px;
            position: absolute;
            left: 0;
            top: 0;
            background: linear-gradient(90deg,#ffb531,#ff5e6d);
            transition: 0.4s ease;
            box-shadow: 0 10px 25px rgba(255,94,109,0.25);
        }

            /* KETIKA BERALIH KE REGISTER */
            body.dark .slide-btn{
                background: linear-gradient(90deg,#57d4c7,#49c7bb);
                box-shadow: 0 10px 25px rgba(87,212,199,0.25);
            }

        /* MENGGESER TOMBOL LOGIN KE REGIS */
        .geser-btn{
            width: 125px;
            height: 58px;
            background: transparent;
            position: relative;
            z-index: 2;
            font-size: 15px;
            font-weight: 700;
            color: #888;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        .geser-btn.active{
            color: white;
        }

            body.dark .geser-btn{
                color: rgba(255,255,255,0.45);
            }

            body.dark .geser-btn.active{
                color: white;
            }

        .form-box{
            overflow: hidden;
        }

        .forms{
            width: 200%;
            display: flex;
            transition: 0.5s ease;
        }

        form{
            width: 50%;
        }

        form h4{
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            color: #1b2559;
            margin-bottom: 12px;
            transition: 0.4s;
        }

            body.dark form h4{
                color: white;
            }

        .sub-text{
            text-align: center;
            color: #7b7b7b;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.7;
        }

            body.dark .sub-text{
                color: rgba(255,255,255,0.65);
            }

        .input-group{
            margin-bottom: 24px;
        }
 
        .input-group input{
            width: 100%;
            border: 2px solid #ececec;
            border-radius: 18px;
            padding: 16px 18px;
            outline: none;
            font-size: 15px;
            background: #fff;
            transition: 0.3s ease;
            color: #1d1d1d;
        }

        .input-group input:focus{
            border-color: #57d4c7;
        }

            body.dark .input-group input{
                background: rgba(255,255,255,0.06);
                border: 2px solid rgba(255,255,255,0.12);
                color: white;
            }

            body.dark .input-group input:focus{
                border-color: #57d4c7;
            }

            body.dark .input-group input::placeholder{
                color: rgba(255,255,255,0.45);
            }

        .bottom-text{
            text-align: center;
            margin-top: 5px;
        }

        .bottom-text a{
            text-decoration: none;
            font-size: 14px;
            color: #8b8b8b;
            transition: 0.3s;
        }

        .bottom-text a:hover{
            color: #57d4c7;
        }

            body.dark .bottom-text a{
                color: rgba(255,255,255,0.55);
            }

        .submit-btn{
            width: 100%;
            border: none;
            border-radius: 50px;
            padding: 16px;
            margin-top: 30px;
            background: linear-gradient(90deg,#ffb531,#ff5e6d);
            color: white;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .submit-btn:hover{
            transform: translateY(-4px);
            color: white;
        }

            body.dark .submit-btn{
                background: linear-gradient(90deg,#57d4c7,#49c7bb);
            }

        @media(max-width:576px){

            .wrap{
                width: 100%;
                padding: 40px 25px;
            }

            .logo{
                font-size: 32px;
            }

            form h3{
                font-size: 28px;
            }
        }

    </style>

</head>
<body>
    <div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
        <div class="wrap">
            <div class="logo">
                Bantu Nyata
            </div>
            <div class="tombol-dua">
                <div class="slide-btn" id="slide"></div>
                <button class="geser-btn active" onclick="masuk()">
                    Masuk
                </button>
                <button class="geser-btn" onclick="daftar()">
                    Daftar
                </button>
            </div>
            <div class="form-box">
                <div class="forms" id="forms">
                    <form action="" method="post">
                        <h4>Selamat Datang Kembali</h4>
                        <p class="sub-text">
                            Masuk ke akun kamu untuk melanjutkan aktivitas bisnis.
                        </p>
                        <div class="input-group">
                            <input type="text" name="name" placeholder="Nama Pengguna">
                        </div>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email">
                        </div>
                        <div class="bottom-text">
                            <a href="lupa-katasandi.html">
                                Lupa Kata Sandi?
                            </a>
                        </div>
                        <a href="dashboardProvider copy 2.html" name="masuk" class="submit-btn">
                            Masuk Sekarang
                        </a>
                    </form>
                    <form action="" method="post">
                        <h4>Buat Akun</h4>
                        <p class="sub-text">
                            Daftarkan akun baru untuk mulai menggunakan platform.
                        </p>
                        <div class="input-group">
                            <input type="text" name="name" placeholder="Nama Lengkap">
                        </div>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email">
                        </div>
                        <div class="input-group">
                            <input type="password" name="password" placeholder="Kata Sandi">
                        </div>
                        <div class="input-group">
                            <input type="text" name="phone" placeholder="Nomor Telepon">
                        </div>
                        <a href="daftarListing.html" name="submit" class="submit-btn">
                            Daftar Listing Usaha
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let forms = document.getElementById("forms");
        let slide = document.getElementById("slide");
        let body = document.body;
        let buttons = document.querySelectorAll(".geser-btn");

        function daftar(){
            forms.style.transform = "translateX(-50%)";
            slide.style.left = "125px";
            body.classList.add("dark");

            buttons[0].classList.remove("active");
            buttons[1].classList.add("active");
        }

        function masuk(){
            forms.style.transform = "translateX(0%)";
            slide.style.left = "0";
            body.classList.remove("dark");

            buttons[1].classList.remove("active");
            buttons[0].classList.add("active");
        }
    </script>
</body>
</html>
