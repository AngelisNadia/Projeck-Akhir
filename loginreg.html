<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* SELURUH HALAMAN */
        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BAGIAN BODY SEBELUM GELAP/YANG AKTIF/TAMPILAN SAAT BERADA DIFORM LOGIN */
        body {
            font-family: 'Urbanist', sans-serif;
            background: #f8f6f4;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: 0.5s;
        }

            /* UNTUK BERGANTI WARNA BACKGROUND SAAT BERADA DIFORM DAFTAR */
            body.dark {
                background-color: #0e3261;
            }
            
            /* UNTUK MEMBERIKAN BACKGROUND GELAP PADA SAAT BERADA DIFORM DAFTAR */
            body.dark .wrap {
            background: #0e3261;
            }

        /* UNTUK LOGO (BISA BERUBAH) */
        .logo {
            font-size: 34px;
            font-weight: 700;
            color: #0e3261;
            margin-bottom: 40px;
            text-align: center;
            transition: 0.5s;
        }

            /* UNTUK BERUBAH WARNA LOGO SAAT BERADA DIFORM DAFTAR */
            body.dark .logo {
                color: #f8f6f4;
            }

        /* UNTUK MENAMPUNG TOMBOL "MASUK" DAN "DAFTAR" */
        .tombol-dua {
            width: 240px;
            height: 54px;
            background: rgba(14, 50, 97, 0.08);
            border-radius: 40px;
            position: relative;
            display: flex;
            margin: 0 auto 50px auto;
        }

            /* UNTUK BERUBAH BACKGROUND SAAT BERADA DIFORM DAFTAR */
            body.dark .tombol-dua {
                background: rgba(255, 255, 255, 0.15);
            }

        /* BAGIAN GESER TOMBOL "MASUK" DAN "DAFTAR" */
        .slide-btn {
                width: 120px;
                height: 100%;
                background: #0e3261;
                border-radius: 40px;
                position: absolute;
                left: 0;
                top: 0;
                transition: 0.4s ease;
                transform: scale(1.2);
            }

            /* BAGIAN GESER TOMBOL "MASUK" DAN "DAFTAR" SAAT AKTIF/BERADA DIFORMNYA */
            .slide-btn.active {
                transform: scale(1.08);
            }

            /* BAGIAN GESER TOMBOL "MASUK" DAN "DAFTAR" SAAT BERADA DIFORM "DAFTAR" */
            body.dark .slide-btn {
                background: white;
            }

        /* BAGIAN BACKGROUND TOMBOL "MASUK" DAN "DAFTAR" SAAT AKTIF/BERADA DIFORMNYA */
        .geser-btn {
            width: 120px;
            height: 54px;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 2;
            font-size: 15px;
            font-weight: 600;
            color: #0e3261;
            transition: 0.3s
        }

            /* BAGIAN BACKGROUND TOMBOL "MASUK" DAN "DAFTAR" SAAT AKTIF/BERADA DIFORM "MASUK" */
            .geser-btn.active {
                color: white;
            }

            /* BAGIAN BACKGROUND TOMBOL "MASUK" DAN "DAFTAR" SAAT BERADA DIFORM "DAFTAR" */
            body.dark .geser-btn.active {
                color: #0e3261;
            }

            /* BAGIAN BACKGROUND TOMBOL "MASUK" DAN "DAFTAR" SAAT BERADA DIFORM "DAFTAR" DAN TIDAK AKTIF */
            body.dark .geser-btn {
                color: rgba(255, 255, 255, 0.45);
            }

        /* MENGATUR BAGIAN FORM LOGIN DAN DAFTAR */
        form {
            width: 50%;
        }

            /* BAGIAN JUDUL FORM LOGIN DAN DAFTAR */
            form h4 {
                color: #0e3261;
                margin-bottom: 35px;
                text-align: center;
                font-weight: 600;
            }

            /* BAGIAN JUDUL FORM LOGIN DAN DAFTAR SAAT BERADA DIFORM "DAFTAR" */
            body.dark form h4 {
                color: #f8f6f4;
            }

        /* BAGIAN INPUT FORM LOGIN DAN DAFTAR */
        .input-group {
            margin-bottom: 30px;
        }

            /* BAGIAN INPUT FORM LOGIN DAN DAFTAR UNTUK KOTAK KOTAK FORMNYA "LOGIN" */
            .input-group input {
                width: 100%;
                padding: 15px 2px;
                border: none;
                border-bottom: 2px solid rgba(14, 50, 97, 0.18);
                background: transparent;
                outline: none;
                font-size: 17px;
                color: #0e3261;
                cursor: pointer;
                transition: 0.3s;
            }

            /* BAGIAN INPUT FORM LOGIN DAN DAFTAR SAAT FOKUS/DIKLIK-UNTUK "LOGIN" */
            .input-group input:focus {
                border-bottom: 2px solid #0e3261;
            }

            /* BAGIAN INPUT FORM LOGIN DAN DAFTAR SAAT BERADA DIFORM "DAFTAR" */
            body.dark .input-group input {
                border-bottom: 2px solid rgba(255, 255, 255, 0.2);
                color: rgb(255, 255, 255);
            }

            /* BAGIAN INPUT FORM LOGIN DAN DAFTAR SAAT FOKUS/DIKLIK-UNTUK "DAFTAR" */
            body.dark .input-group input:focus {
                border-bottom: 2px solid white;
            }

            /* BAGIAN INPUT FORM LOGIN DAN DAFTAR PLACEHOLDER */
            body.dark .input-group input::placeholder {
                color: rgb(141, 141, 141);
            }

        /* BAGIAN TOMBOL "MASUK" DAN "DAFTAR" */
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: #0e3261;
            color: white;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            text-decoration: none;
            margin-top: 25px;
            transition: 0.3s ease;
            cursor: pointer;
        }

            /* BAGIAN TOMBOL "MASUK" DAN "DAFTAR" SAAT DIHOVER/DIKLIK */
            .submit-btn:hover {
                transform: translateY(-4px);
            }

            /* BAGIAN TOMBOL "MASUK" DAN "DAFTAR" SAAT BERADA DIFORM "DAFTAR" */
            body.dark .submit-btn {
                background: white;
                color: #0e3261;
                margin-top: 30px;
            }

    
    </style>

</head>
<body>
    <div class="kolom-tengah d-flex justify-content-center align-items-center" style="min-height: 100vh; padding: 40px 20px;">
        <div class="wrap card position-relative overflow-hidden" style="background: transparent; width: 420px; margin: auto; border:none;">
            
            <div class="logo text-center">
                Bantu Nyata
            </div>

            <div class="tombol-dua">
                <div class="slide-btn" id="slide"></div>
                <button class="geser-btn active" onclick="masuk()">Masuk</button>
                <button class="geser-btn" onclick="daftar()">Daftar</button>
            </div>

            <div class="form-box">
                <div class="forms" style="width: 200%; display: flex; transition: 0.5s;" id="forms">
                    <form>
                        <h4>Selamat Datang Kembali</h4>
                        <div class="input-group">
                            <input type="text" name="name" placeholder="Nama Pengguna">
                        </div>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email">
                        </div>
                        <div class="bottom-text text-center"  style="margin-top: 10px;">
                            <a href="lupa-katasandi.html" class="text-decoration-none" style=" font-size: 16px; color: #919191;">
                                Lupa Kata Sandi?
                            </a>
                        </div>
                        <a href="home-provider.html" class="submit-btn">Masuk</a>
                    </form>

                    <form>
                        <h4>Buat Akun</h4>
                        <div class="input-group">
                            <input type="text" name="name" placeholder="Nama Lengkap">
                        </div>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email">
                        </div>
                        <div class="input-group">
                            <input type="password" name="password" placeholder="Kata Sandi">
                        </div>
                        <div class="input-group">
                            <input type="text" name="phone" placeholder="Nomor Telepon">
                        </div>
                        <a href="verifikasi.html" class="submit-btn">Daftar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let forms = document.getElementById("forms");
        let slide = document.getElementById("slide");
        let body = document.body;
        let buttons = document.querySelectorAll(".geser-btn");

        /* UNTUK BERGANTI BACKGROUND KE FORM DAFTAR SAAT TOMBOL "DAFTAR" DIKLIK */
        function daftar() {
            forms.style.transform = "translateX(-50%)";
            slide.style.left = "120px";
            body.classList.add("dark");
            buttons[0].classList.remove("active");
            buttons[1].classList.add("active");
        }

        /* UNTUK BERGANTI BACKGROUND KE FORM LOGIN SAAT TOMBOL "MASUK" DIKLIK */
        function masuk() {
            forms.style.transform = "translateX(0%)";
            slide.style.left = "0";
            body.classList.remove("dark");
            buttons[1].classList.remove("active");
            buttons[0].classList.add("active");
        }
    </script>
</body>
</html>
